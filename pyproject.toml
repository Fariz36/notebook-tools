[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notebook-tools"
version = "0.1.0"
description = "LLM-first tools for operating on Jupyter notebooks"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
  "nbformat>=5",
  "ipykernel>=6",
  "jupyter_client>=8",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.4",
  "pytest>=8",
]

[project.scripts]
notebook-tools = "notebook_tools.cli:main"

[project.urls]
Homepage = "https://github.com/Fariz36/notebook-tools"
Documentation = "https://github.com/Fariz36/notebook-tools#readme"
Repository = "https://github.com/Fariz36/notebook-tools"
Issues = "https://github.com/Fariz36/notebook-tools/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
